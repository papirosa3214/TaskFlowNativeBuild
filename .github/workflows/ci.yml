# Правки iOS идут веткой и PR, как на сервере (владелец 28.10.2026):
# зелёная сборка без конфликтов вливается сама, конфликт оставляет PR агенту.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка iOS
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Самый свежий Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: xcodegen
        run: brew install xcodegen && xcodegen generate
      - name: Сборка под устройство без подписи
        run: |
          set -o pipefail
          xcodebuild -project TaskFlow.xcodeproj -scheme TaskFlow \
            -destination 'generic/platform=iOS' -derivedDataPath build_ci \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Лог сборки при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

  automerge:
    name: Автослияние
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Влить PR в main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Конфликт — merge откажет, PR останется открытым для агента.
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch
